name: Windows build
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore and rebuild
        shell: pwsh
        run: |
          Remove-Item PlayWithData/bin, PlayWithData/obj -Recurse -Force -ErrorAction SilentlyContinue
          nuget restore PlayWithData.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msbuild = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild/**/Bin/MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          & $msbuild PlayWithData.sln /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
